<section class="tasbih">

<h1>Tasbih Counter</h1>

<p>Remember Allah with every count.</p>

<div class="counter-card">

<div class="dhikr">

<select id="dhikr">

<option>SubhanAllah</option>

<option>Alhamdulillah</option>

<option>Allahu Akbar</option>

<option>La ilaha illallah</option>

<option>Astaghfirullah</option>

</select>

</div>

<div class="counter" id="count">

0

</div>

<div class="goal">

Goal

<span id="goalText">

33

</span>

</div>

<input
type="range"
id="goalSlider"
min="33"
max="1000"
value="33"
>

<div class="buttons">

<button id="undo">

↩ Undo

</button>

<button id="reset">

Reset

</button>

</div>

<button id="countBtn">

📿 Count

</button>

</div>

</section>
