<section class="tasbih">

<h1>তাসবিহ কাউন্টার</h1>

<p>প্রতিটি গণনার সাথে আল্লাহকে স্মরণ করুন।</p>

<div class="counter-card">

<div class="dhikr">

<select id="dhikr">

<option>সুবহানাল্লাহ</option>

<option>আলহামদুলিল্লাহ</option>

<option>লা ইলাহা ইল্লাল্লাহ</option>

<option>আল্লাহু আকবার</option>

<option>আস্তাগফিরুল্লাহ</option>

</select>

</div>

<div class="counter" id="count">

0

</div>

<div class="goal">

    লক্ষ্য

<span id="goalText">

৩৩

</span>

</div>

<input
type="range"
id="goalSlider"
min="33"
max="1000"
value="33"
>

<div class="buttons">

<button id="undo">

↩ Undo

</button>

<button id="reset">

Reset

</button>

</div>

<button id="countBtn">

📿 Count

</button>

</div>
